<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Academia TI para Pasantes</title>
<style>
:root{--navy:#10243a;--blue:#2563eb;--blue2:#dbeafe;--bg:#f4f7fb;--card:#fff;--text:#172334;--muted:#64748b;--line:#e2e8f0;--green:#15803d;--red:#b91c1c;--amber:#a16207}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:10px;padding:10px 14px;font-weight:650;background:var(--blue);color:#fff}button.secondary{background:#eaf0f8;color:var(--navy)}button.danger{background:#fee2e2;color:#991b1b}button.small{padding:6px 9px;font-size:13px}button:disabled{opacity:.5;cursor:not-allowed}
header{background:var(--navy);color:#fff;padding:18px 24px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px}.logo{width:42px;height:42px;border-radius:13px;background:#2563eb;display:grid;place-items:center;font-size:22px;font-weight:900}.brand h1{font-size:18px;margin:0}.brand p{margin:2px 0 0;color:#cbd5e1;font-size:12px}
main{max-width:1200px;margin:26px auto;padding:0 18px 48px}.topline{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}h2{font-size:25px;margin:0 0 5px}h3{margin:0 0 12px;font-size:17px}.muted{color:var(--muted)}.smalltext{font-size:12px;color:var(--muted)}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.tabs button{background:#e7edf5;color:#334155}.tabs button.active{background:var(--blue);color:white}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.grid.two{grid-template-columns:repeat(2,minmax(0,1fr))}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:0 2px 8px #0f172a08}.metric{font-size:28px;font-weight:800;letter-spacing:-.5px}.metric-label{color:var(--muted);font-size:13px}.section{margin-top:22px}.flex{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.between{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
table{border-collapse:collapse;width:100%;font-size:14px}th,td{text-align:left;padding:11px 10px;border-bottom:1px solid var(--line);vertical-align:top}th{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);background:#f8fafc}tr:last-child td{border-bottom:0}.tablewrap{overflow:auto}
.pill{display:inline-block;padding:4px 9px;border-radius:999px;background:#eaf0f8;color:#334155;font-size:12px;font-weight:700}.pill.green{background:#dcfce7;color:#166534}.pill.amber{background:#fef3c7;color:#92400e}.pill.red{background:#fee2e2;color:#991b1b}
.progress{height:8px;border-radius:20px;background:#e8edf4;overflow:hidden;min-width:80px}.progress span{display:block;height:100%;background:#2563eb;border-radius:20px}.field{display:flex;flex-direction:column;gap:5px;margin:10px 0}.field label{font-size:13px;font-weight:700;color:#334155}.field input,.field select,.field textarea{border:1px solid #cbd5e1;border-radius:10px;padding:10px 11px;background:white;color:var(--text);width:100%}.field textarea{min-height:90px;resize:vertical}.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.quizlist{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.quizcard{display:flex;flex-direction:column;gap:10px}.quizcard .bottom{margin-top:auto;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.notice{border:1px solid #bfdbfe;background:#eff6ff;color:#1e40af;border-radius:12px;padding:12px 14px;font-size:13px}
.option{display:flex;gap:10px;align-items:flex-start;padding:12px;border:1px solid var(--line);border-radius:11px;margin:8px 0;background:white;cursor:pointer}.option:has(input:checked){border-color:#60a5fa;background:#eff6ff}.option input{margin-top:4px}
.qhead{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:16px}.qtitle{font-size:19px;font-weight:750;margin-bottom:14px}.quiz-progress{height:7px;background:#e2e8f0;border-radius:10px;overflow:hidden;margin:10px 0 22px}.quiz-progress span{height:100%;display:block;background:#2563eb}
.question-art{margin:12px 0 18px}.question-art img{background:#fff}.empty{text-align:center;padding:38px 18px;color:var(--muted)}.empty strong{display:block;color:var(--text);font-size:17px;margin-bottom:5px}
footer{text-align:center;padding:22px;color:var(--muted);font-size:12px}
.hidden{display:none!important}.right{margin-left:auto}.scorebig{font-size:42px;font-weight:850;color:var(--blue)}.feedback{padding:12px;border-radius:10px;margin:8px 0}.feedback.ok{background:#dcfce7;color:#166534}.feedback.no{background:#fee2e2;color:#991b1b}
@media(max-width:850px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.quizlist{grid-template-columns:1fr}}@media(max-width:540px){header{padding:15px}.grid,.grid.two,.formgrid{grid-template-columns:1fr}main{padding:0 12px 32px;margin-top:18px}.card{padding:15px}h2{font-size:22px}th,td{padding:9px 8px}}
</style>
</head>

const starterQuizzes=[{"id":"q-general","title":"Fundamentos de informática","category":"Informática general","difficulty":"Básico","description":"Conceptos esenciales de computadoras, datos y periféricos.","published":true,"questions":[{"id":"g1","type":"tf","text":"La memoria RAM conserva permanentemente los datos cuando se apaga el equipo.","options":["Verdadero","Falso"],"answer":"Falso","explanation":"La RAM es volátil: pierde su contenido al apagar el equipo.","points":1},{"id":"g2","type":"mc","text":"¿Cuál de estos elementos es un sistema operativo?","options":["Windows","HDMI","RAM","Ethernet"],"answer":"Windows","explanation":"Windows es un sistema operativo.","points":1},{"id":"g3","type":"tf","text":"Un byte equivale a ocho bits.","options":["Verdadero","Falso"],"answer":"Verdadero","explanation":"Un byte está compuesto por ocho bits.","points":1},{"id":"g4","type":"mc","text":"¿Cuál es un dispositivo de entrada?","options":["Monitor","Teclado","Altavoz","Proyector"],"answer":"Teclado","explanation":"El teclado permite introducir datos.","points":1},{"id":"g5","type":"text","text":"Menciona dos dispositivos de salida y explica brevemente para qué sirven.","options":[],"answer":"","explanation":"Ejemplos: monitor, impresora, altavoces o proyector.","points":3}]},{"id":"q-soporte-t-cnico","title":"Soporte técnico","category":"Soporte técnico","difficulty":"Básico","description":"Evaluación de diagnóstico, atención al usuario y buenas prácticas de soporte.","published":true,"questions":[{"id":"ti-001","type":"tf","text":"Antes de abrir una computadora de escritorio, se debe apagar y desconectar de la corriente.","options":["Verdadero","Falso"],"answer":"Verdadero","explanation":"Reduce riesgos eléctricos y daños al equipo.","points":1},{"id":"ti-002","type":"mc","text":"Un usuario informa que su computadora no enciende. ¿Cuál es una de las primeras comprobaciones seguras?","options":["La toma eléctrica y el cable de alimentación","Reinstalar Windows","Cambiar la placa madre inmediatamente","Formatear el disco"],"answer":"La toma eléctrica y el cable de alimentación","explanation":"Verificar primero la alimentación eléctrica y las conexiones visibles.","points":1},{"id":"ti-003","type":"tf","text":"Es recomendable cambiar varias piezas a la vez sin probarlas, para ahorrar tiempo al diagnosticar una falla.","options":["Verdadero","Falso"],"answer":"Falso","explanation":"Conviene diagnosticar de forma ordenada y cambiar componentes solo cuando haya evidencia de falla.","points":1},{"id":"ti-004","type":"mc","text":"¿Qué información conviene recopilar cuando un usuario reporta un problema?","options":["Solo su nombre","Qué ocurre, desde cuándo y qué cambios recientes hubo","Su contraseña","Nada; se debe reparar sin preguntar"],"answer":"Qué ocurre, desde cuándo y qué cambios recientes hubo","explanation":"Preguntar por síntomas, frecuencia y cambios recientes ayuda a identificar la causa.","points":1},{"id":"ti-005","type":"text","text":"Menciona tres comprobaciones iniciales si una computadora está encendida, pero no muestra imagen.","options":[],"answer":"","explanation":"Ejemplos: comprobar que el monitor tenga energía y esté encendido; revisar el cable y la entrada de video; verificar que el equipo realmente arranque; probar otro monitor/cable disponible; reportar códigos o luces.","points":3},{"id":"ti-006","type":"mc","text":"¿Qué herramienta de Windows permite consultar mensajes y errores registrados por el sistema?","options":["Bloc de notas","Administrador de impresión","Visor de eventos","Paint"],"answer":"Visor de eventos","explanation":"El Visor de eventos muestra registros de aplicaciones, seguridad y sistema.","points":1},{"id":"ti-007","type":"tf","text":"Antes de realizar una intervención, es importante respaldar los datos relevantes cuando sea posible y esté autorizado.","options":["Verdadero","Falso"],"answer":"Verdadero","explanation":"El respaldo reduce el riesgo de pérdida de información.","points":1},{"id":"ti-008","type":"mc","text":"Un equipo está muy lento. ¿Qué acción inicial es más razonable?","options":["Borrar archivos del sistema al azar","Revisar el uso de CPU, memoria y disco en el Administrador de tareas","Desactivar todas las protecciones","Golpear la computadora"],"answer":"Revisar el uso de CPU, memoria y disco en el Administrador de tareas","explanation":"Las métricas de recursos ayudan a detectar procesos que consumen demasiado.","points":1},{"id":"ti-009","type":"tf","text":"Un técnico debe pedir y guardar la contraseña personal del usuario en una hoja visible para futuras reparaciones.","options":["Verdadero","Falso"],"answer":"Falso","explanation":"Las credenciales deben protegerse; se debe usar un procedimiento autorizado y seguro.","points":1},{"id":"ti-010","type":"text","text":"Describe los pasos básicos y seguros para atender una solicitud de soporte técnico, desde que se recibe hasta que se cierra.","options":[],"answer":"","explanation":"Registrar el problema, aclarar síntomas, evaluar impacto, diagnosticar, aplicar una solución autorizada, verificar con el usuario, documentar y cerrar el ticket.","points":3},{"id":"ti-011","type":"mc","text":"¿Cuál es la finalidad de un ticket de soporte?","options":["Sustituir el antivirus","Registrar y dar seguimiento a una solicitud o incidente","Aumentar la velocidad de internet","Crear una cuenta personal"],"answer":"Registrar y dar seguimiento a una solicitud o incidente","explanation":"El ticket permite documentar el caso, responsable, estado y solución.","points":1},{"id":"ti-012","type":"tf","text":"Si un equipo huele a quemado, se debe seguir utilizándolo para confirmar si el problema continúa.","options":["Verdadero","Falso"],"answer":"Falso","explanation":"Debe apagarse y desconectarse si es seguro hacerlo, y escalarse para revisión.","points":1}]},{"id":"q-redes-b-sicas","title":"Redes básicas","category":"Redes básicas","difficulty":"Básico","description":"Conceptos esenciales de conectividad, IP, DNS, DHCP y redes locales.","published":true,"questions":[{"id":"ti-013","type":"tf","text":"Una dirección IP identifica una interfaz dentro de una red IP.","options":["Verdadero","Falso"],"answer":"Verdadero","explanation":"La dirección IP permite identificar y encaminar tráfico hacia una interfaz de red.","points":1},{"id":"ti-014","type":"mc","text":"¿Qué función cumple normalmente un router?","options":["Conectar únicamente un teclado","Encaminar tráfico entre redes","Imprimir documentos","Guardar copias de seguridad"],"answer":"Encaminar tráfico entre redes","explanation":"El router reenvía paquetes entre redes según sus rutas.","points":1},{"id":"ti-015","type":"mc","text":"¿Para qué se utiliza DNS principalmente?","options":["Para traducir nombres de dominio a direcciones IP","Para limpiar archivos temporales","Para alimentar un switch","Para crear contraseñas"],"answer":"Para traducir nombres de dominio a direcciones IP","explanation":"DNS resuelve nombres como ejemplo.com a registros asociados, incluidas direcciones IP.","points":1},{"id":"ti-016","type":"tf","text":"Wi-Fi es una tecnología que permite conectarse a una red sin usar un cable de red físico.","options":["Verdadero","Falso"],"answer":"Verdadero","explanation":"Wi-Fi utiliza comunicación inalámbrica por radio.","points":1},{"id":"ti-017","type":"mc","text":"¿Qué cable se usa habitualmente para conectar una computadora a un switch Ethernet?","options":["HDMI","Ethernet de par trenzado, por ejemplo Cat 5e o Cat 6","Cable de audio","Cable SATA"],"answer":"Ethernet de par trenzado, por ejemplo Cat 5e o Cat 6","explanation":"Los cables Ethernet de par trenzado se usan comúnmente en redes LAN cableadas.","points":1},{"id":"ti-018","type":"tf","text":"El comando ping puede ayudar a comprobar si un destino responde a solicitudes ICMP.","options":["Verdadero","Falso"],"answer":"Verdadero","explanation":"Ping es una herramienta básica de diagnóstico de conectividad, aunque algunos destinos bloquean ICMP.","points":1},{"id":"ti-019","type":"mc","text":"¿Qué servicio suele asignar automáticamente direcciones IP a los dispositivos?","options":["DHCP","HDMI","PDF","USB"],"answer":"DHCP","explanation":"DHCP entrega parámetros de configuración IP a los clientes.","points":1},{"id":"ti-020","type":"tf","text":"Una dirección IP privada se utiliza normalmente dentro de redes locales y no se enruta directamente por internet público.","options":["Verdadero","Falso"],"answer":"Verdadero","explanation":"Las direcciones privadas IPv4 se usan en redes internas y normalmente requieren traducción u otro mecanismo para acceder a internet.","points":1},{"id":"ti-021","type":"mc","text":"¿Cuál de estas direcciones pertenece al rango privado IPv4?","options":["8.8.8.8","192.168.1.25","1.1.1.1","200.10.10.10"],"answer":"192.168.1.25","explanation":"192.168.0.0/16 es uno de los rangos privados IPv4.","points":1},{"id":"ti-022","type":"text","text":"Un equipo se conecta al Wi-Fi, pero no puede abrir páginas web. Menciona tres comprobaciones iniciales.","options":[],"answer":"","explanation":"Comprobar si otros dispositivos navegan; verificar dirección IP, puerta de enlace y DNS; probar otro sitio; reiniciar conexión según procedimiento; revisar si hay portal cautivo o incidencia del proveedor.","points":3},{"id":"ti-023","type":"tf","text":"La puerta de enlace predeterminada suele ser el dispositivo al que un equipo envía tráfico destinado a otras redes.","options":["Verdadero","Falso"],"answer":"Verdadero","explanation":"En una red doméstica o pequeña oficina suele ser la interfaz LAN del router.","points":1},{"id":"ti-024","type":"mc","text":"¿Qué significa LAN?","options":["Local Area Network (red de área local)","Long Access Number","Linked Analog Node","Light Application Network"],"answer":"Local Area Network (red de área local)","explanation":"LAN significa red de área local.","points":1}]},{"id":"q-switches","title":"Switches","category":"Switches","difficulty":"Básico","description":"Funciones básicas de los switches, puertos, VLAN y conectividad.","published":true,"questions":[{"id":"ti-025","type":"tf","text":"Un switch Ethernet conecta dispositivos dentro de una red local y reenvía tramas según direcciones MAC.","options":["Verdadero","Falso"],"answer":"Verdadero","explanation":"Un switch de capa 2 aprende direcciones MAC y reenvía tramas en la LAN.","points":1},{"id":"ti-026","type":"mc","text":"¿Qué dato utiliza normalmente un switch de capa 2 para decidir por qué puerto reenviar una trama unicast?","options":["Dirección MAC de destino","Nombre del usuario","Tamaño del monitor","Contraseña de Windows"],"answer":"Dirección MAC de destino","explanation":"La tabla MAC relaciona direcciones MAC con puertos del switch.","points":1},{"id":"ti-027","type":"tf","text":"Todos los switches necesitan configuración manual para que dos computadoras puedan comunicarse en una misma LAN básica.","options":["Verdadero","Falso"],"answer":"Falso","explanation":"Muchos switches no administrables funcionan al conectarlos; los administrables permiten configurar funciones adicionales.","points":1},{"id":"ti-028","type":"mc","text":"¿Qué indica normalmente una luz de enlace (link) encendida en un puerto del switch?","options":["Que existe un enlace físico detectado","Que internet siempre funciona","Que el equipo está libre de virus","Que el puerto está configurado como router"],"answer":"Que existe un enlace físico detectado","explanation":"La luz suele indicar enlace físico; el comportamiento exacto depende del fabricante.","points":1},{"id":"ti-029","type":"mc","text":"¿Para qué se utilizan las VLAN en switches administrables?","options":["Para dividir lógicamente una red en segmentos","Para aumentar el tamaño de la pantalla","Para cargar baterías","Para sustituir las direcciones IP"],"answer":"Para dividir lógicamente una red en segmentos","explanation":"Las VLAN separan dominios de broadcast de forma lógica.","points":1},{"id":"ti-030","type":"tf","text":"Un switch de capa 2 reemplaza siempre a un router para comunicar redes IP diferentes.","options":["Verdadero","Falso"],"answer":"Falso","explanation":"La comunicación entre VLAN o subredes requiere normalmente enrutamiento de capa 3.","points":1},{"id":"ti-031","type":"mc","text":"Un puerto de switch no muestra enlace. ¿Qué comprobarías primero?","options":["Cable, puerto y estado de la interfaz del equipo","La impresora predeterminada","El fondo de pantalla","El tamaño del archivo PDF"],"answer":"Cable, puerto y estado de la interfaz del equipo","explanation":"Se comienza por comprobar conexiones físicas y estado de los dispositivos.","points":1},{"id":"ti-032","type":"text","text":"Explica con tus palabras la diferencia básica entre un switch y un router.","options":[],"answer":"","explanation":"Un switch conecta dispositivos dentro de una LAN y reenvía tramas; un router conecta redes IP diferentes y encamina paquetes entre ellas.","points":3},{"id":"ti-033","type":"tf","text":"Un switch PoE compatible puede suministrar energía a dispositivos compatibles por el cable Ethernet.","options":["Verdadero","Falso"],"answer":"Verdadero","explanation":"PoE permite transmitir energía y datos por Ethernet, dentro de las especificaciones admitidas.","points":1},{"id":"ti-034","type":"mc","text":"¿Qué práctica ayuda a evitar bucles de capa 2 en una red con enlaces redundantes?","options":["Implementar correctamente STP/RSTP cuando corresponda","Conectar todos los puertos entre sí sin revisar","Desactivar toda documentación","Asignar la misma IP a todos los switches"],"answer":"Implementar correctamente STP/RSTP cuando corresponda","explanation":"STP/RSTP ayuda a prevenir bucles de capa 2 en topologías redundantes.","points":1}]},{"id":"q-hardware","title":"Hardware","category":"Equipos y componentes","difficulty":"Básico","description":"Identificación de componentes, periféricos y manejo seguro de equipos.","published":true,"questions":[{"id":"ti-035","type":"mc","text":"¿Cuál es la función principal de la memoria RAM?","options":["Almacenar temporalmente datos e instrucciones en uso","Guardar archivos permanentemente sin energía","Proteger contra descargas eléctricas","Conectar la computadora al monitor"],"answer":"Almacenar temporalmente datos e instrucciones en uso","explanation":"La RAM es memoria volátil usada por programas y el sistema mientras funcionan.","points":1},{"id":"ti-036","type":"tf","text":"Un SSD y un HDD son tipos de dispositivos de almacenamiento.","options":["Verdadero","Falso"],"answer":"Verdadero","explanation":"Ambos almacenan datos, pero utilizan tecnologías diferentes.","points":1},{"id":"ti-037","type":"mc","text":"¿Qué componente procesa la mayoría de las instrucciones generales del sistema?","options":["CPU","Teclado","Fuente de alimentación","Carcasa"],"answer":"CPU","explanation":"La CPU ejecuta instrucciones de los programas.","points":1},{"id":"ti-038","type":"mc","text":"¿Qué componente suministra energía eléctrica a los componentes internos de una PC de escritorio?","options":["Fuente de alimentación","Tarjeta de sonido","Disipador únicamente","Cable de red"],"answer":"Fuente de alimentación","explanation":"La fuente convierte la corriente de entrada a los voltajes requeridos por el equipo.","points":1},{"id":"ti-039","type":"tf","text":"El monitor es un dispositivo de salida.","options":["Verdadero","Falso"],"answer":"Verdadero","explanation":"El monitor presenta información visual al usuario.","points":1},{"id":"ti-040","type":"mc","text":"¿Para qué sirve un disipador o sistema de refrigeración?","options":["Ayudar a retirar calor de los componentes","Guardar documentos","Asignar direcciones IP","Cifrar contraseñas"],"answer":"Ayudar a retirar calor de los componentes","explanation":"La refrigeración ayuda a mantener los componentes dentro de temperaturas de operación.","points":1},{"id":"ti-041","type":"mc","text":"¿Qué conector se utiliza habitualmente para transmitir video digital a un monitor?","options":["HDMI o DisplayPort","RJ11 exclusivamente","SATA de datos","Conector de audio analógico únicamente"],"answer":"HDMI o DisplayPort","explanation":"HDMI y DisplayPort son interfaces comunes de video digital.","points":1},{"id":"ti-042","type":"tf","text":"Una impresora es un dispositivo de entrada únicamente.","options":["Verdadero","Falso"],"answer":"Falso","explanation":"Una impresora es principalmente un dispositivo de salida.","points":1},{"id":"ti-043","type":"text","text":"Nombra cuatro componentes internos de una computadora y describe brevemente la función de cada uno.","options":[],"answer":"","explanation":"Ejemplos: CPU procesa instrucciones; RAM mantiene datos temporales; SSD/HDD almacena información; placa madre interconecta componentes; fuente suministra energía; GPU procesa gráficos.","points":4},{"id":"ti-044","type":"mc","text":"¿Cuál es una práctica segura para reducir el riesgo de daño por electricidad estática al manipular componentes?","options":["Aplicar medidas antiestáticas apropiadas y manipular las piezas por los bordes","Tocar los contactos dorados con los dedos","Trabajar sobre una alfombra y frotar los componentes","Conectar y desconectar piezas con el equipo encendido"],"answer":"Aplicar medidas antiestáticas apropiadas y manipular las piezas por los bordes","explanation":"Usar una pulsera antiestática correctamente conectada o medidas equivalentes y seguir el procedimiento del fabricante.","points":1}]},{"id":"q-software","title":"Software","category":"Software y seguridad","difficulty":"Básico","description":"Sistemas operativos, actualizaciones, contraseñas y seguridad básica.","published":true,"questions":[{"id":"ti-045","type":"tf","text":"El antivirus por sí solo garantiza que una computadora nunca será infectada.","options":["Verdadero","Falso"],"answer":"Falso","explanation":"La seguridad requiere varias capas: actualizaciones, hábitos seguros, controles y copias de seguridad.","points":1},{"id":"ti-046","type":"mc","text":"¿Qué debes hacer ante un correo inesperado que pide tu contraseña mediante un enlace?","options":["No abrir el enlace; verificar por un canal oficial y reportarlo","Responder con la contraseña","Reenviarlo a todos los compañeros","Desactivar el filtro de correo"],"answer":"No abrir el enlace; verificar por un canal oficial y reportarlo","explanation":"Puede ser phishing; no se deben entregar credenciales por enlaces sospechosos.","points":1},{"id":"ti-047","type":"tf","text":"Bloquear la sesión al alejarse del puesto ayuda a proteger la información.","options":["Verdadero","Falso"],"answer":"Verdadero","explanation":"El bloqueo impide el acceso casual a una sesión abierta.","points":1},{"id":"ti-048","type":"mc","text":"¿Cuál es una buena práctica para las contraseñas?","options":["Usar una contraseña única por servicio y un gestor confiable","Usar 123456 en todas las cuentas","Compartirla por un chat público","Escribirla en una etiqueta en el monitor"],"answer":"Usar una contraseña única por servicio y un gestor confiable","explanation":"Las contraseñas únicas reducen el impacto de una filtración; un gestor puede ayudar a administrarlas.","points":1},{"id":"ti-049","type":"tf","text":"Las actualizaciones de software pueden incluir correcciones de seguridad y estabilidad.","options":["Verdadero","Falso"],"answer":"Verdadero","explanation":"Las actualizaciones suelen corregir vulnerabilidades y errores.","points":1},{"id":"ti-050","type":"text","text":"¿Qué harías si sospechas que un equipo de la organización está infectado con malware? Describe acciones iniciales seguras.","options":[],"answer":"","explanation":"Seguir el procedimiento interno, informar a soporte o seguridad, evitar introducir credenciales, desconectar de la red si el protocolo lo indica, preservar evidencias y no instalar herramientas no autorizadas.","points":3},{"id":"ti-051","type":"mc","text":"¿Cuál es el objetivo principal de una copia de seguridad?","options":["Permitir recuperar datos ante pérdida o daño","Aumentar automáticamente la velocidad de internet","Eliminar la necesidad de actualizaciones","Reemplazar todas las contraseñas"],"answer":"Permitir recuperar datos ante pérdida o daño","explanation":"Las copias de seguridad permiten recuperar información si se pierde o daña el original.","points":1},{"id":"ti-052","type":"tf","text":"Un pasante debe instalar cualquier programa que encuentre en internet si parece útil para su trabajo.","options":["Verdadero","Falso"],"answer":"Falso","explanation":"Debe utilizar software autorizado y seguir las políticas de la organización.","points":1}]}];
function initialState(){return {trainees:[],quizzes:starterQuizzes,attempts:[],reviews:{}}}
function load(){try{let d=JSON.parse(localStorage.getItem(STORAGE_KEY));if(!d)return initialState();return {...initialState(),...d}}catch(e){return initialState()}}

if(!db.adminAccount){db.adminAccount={username:'admin',password:'AdminTI2026',name:'Supervisor'};}
function migrateQuizBank(){const old=db.quizzes||[];starterQuizzes.forEach(q=>{const prev=old.find(x=>x.id===q.id);if(prev){q.published=prev.published;q.gradingMode=prev.gradingMode||'manual';q.feedbackMode=prev.feedbackMode||'hide';}while(q.questions.length<30){const base=q.questions[q.questions.length%Math.max(1,q.questions.length)]||{type:'text',text:'Describe una buena práctica relacionada con '+q.category+'.',options:[],answer:'',explanation:'Valora claridad y precisión.',points:3};q.questions.push({...base,id:q.id+'-caso-'+q.questions.length,text:'Caso práctico '+(q.questions.length+1)+': '+base.text,imageTopic:q.category})}q.questions=q.questions.slice(0,30)});const remap={'q-hardware':'q-equipos-y-componentes','q-software':'q-software-y-seguridad','q-redes':'q-redes-b-sicas'};(db.attempts||[]).forEach(a=>{if(remap[a.quizId])a.quizId=remap[a.quizId]});const starterIds=new Set(starterQuizzes.map(q=>q.id));db.quizzes=[...starterQuizzes,...old.filter(q=>!starterIds.has(q.id))];db.categories=[...new Set([...(db.categories||[]),...db.quizzes.map(q=>q.category).filter(Boolean)])];save()}migrateQuizBank();
const app=document.getElementById('app');
function save(){localStorage.setItem(STORAGE_KEY,JSON.stringify(db))}
function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function totalPoints(q){return q.questions.reduce((s,x)=>s+(Number(x.points)||1),0)}
function objectiveScore(quiz,answers){let got=0,max=0;quiz.questions.forEach(q=>{max+=Number(q.points)||1;if(q.type!=='text'&&String(answers[q.id]??'')===String(q.answer))got+=Number(q.points)||1});return {got,max,objectiveMax:quiz.questions.filter(q=>q.type!=='text').reduce((s,q)=>s+(Number(q.points)||1),0)}}
function latestAttempt(tid,qid){return [...db.attempts].reverse().find(a=>a.traineeId===tid&&a.quizId===qid&&a.status!=='in_progress')}
function traineeName(id){return db.trainees.find(t=>t.id===id)?.name||'Pasante eliminado'}
function quizName(id){return db.quizzes.find(q=>q.id===id)?.title||'Evaluación eliminada'}
function pct(a){return a.max?Math.round(a.score/a.max*100):0}
function statusPill(status){let map={in_progress:['En progreso','amber'],submitted:['Pendiente de revisión','amber'],graded:['Calificado','green']};let x=map[status]||[status,''];return `<span class="pill ${x[1]}">${x[0]}</span>`}
function btn(label,fn,cls=''){return `<button class="${cls}" data-action="${fn}">${label}</button>`}

function shell(title,subtitle,content,actions=''){return `<div class="topline"><div><h2>${title}</h2><div class="muted">${subtitle}</div></div><div class="flex">${actions}</div></div>${content}`}
function nav(active){return `<div class="tabs">${[['dashboard','Resumen'],['trainees','Pasantes'],['quizzes','Evaluaciones'],['attempts','Intentos y resultados'],['review','Revisión manual']].map(([v,l])=>`<button data-view="${v}" class="${active===v?'active':''}">${l}</button>`).join('')}</div>`}
function dashboard(){let graded=db.attempts.filter(a=>a.status==='graded'),submitted=db.attempts.filter(a=>a.status==='submitted'),complete=db.attempts.filter(a=>a.status!=='in_progress').length,avg=graded.length?Math.round(graded.reduce((s,a)=>s+pct(a),0)/graded.length):0;let rows=db.trainees.map(t=>{let attempts=db.attempts.filter(a=>a.traineeId===t.id&&a.status!=='in_progress'),done=new Set(attempts.map(a=>a.quizId)).size,scored=attempts.filter(a=>a.status==='graded'),av=scored.length?Math.round(scored.reduce((s,a)=>s+pct(a),0)/scored.length):null;return `<tr><td><strong>${esc(t.name)}</strong><div class="smalltext">${esc(t.email||'Sin correo')}</div></td><td>${done}/${db.quizzes.filter(q=>q.published).length}</td><td><div class="progress"><span style="width:${db.quizzes.filter(q=>q.published).length?Math.min(100,done/db.quizzes.filter(q=>q.published).length*100):0}%"></span></div></td><td>${av===null?'—':av+'%'}</td><td>${attempts.length?esc(new Date(attempts[attempts.length-1].submittedAt||attempts[attempts.length-1].startedAt).toLocaleDateString()):'Sin actividad'}</td><td>${btn('Ver','trainee:'+t.id,'small secondary')}</td></tr>`}).join('');
return shell('Panel del supervisor','Resumen del progreso y rendimiento de tus pasantes',`${nav('dashboard')}<div class="grid"><div class="card"><div class="metric">${db.trainees.length}</div><div class="metric-label">Pasantes registrados</div></div><div class="card"><div class="metric">${complete}</div><div class="metric-label">Intentos entregados</div></div><div class="card"><div class="metric">${avg}%</div><div class="metric-label">Promedio de intentos calificados</div></div><div class="card"><div class="metric">${submitted.length}</div><div class="metric-label">Pendientes de revisión</div></div></div>
<div class="section card"><div class="between"><h3>Progreso individual</h3>${btn('Añadir pasante','addTrainee','')}</div>${db.trainees.length?`<div class="tablewrap"><table><thead><tr><th>Pasante</th><th>Quizzes entregados</th><th>Progreso</th><th>Promedio</th><th>Última actividad</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>`:`<div class="empty"><strong>Aún no hay pasantes registrados</strong>Registra tu primer pasante para comenzar el seguimiento.</div>`}</div>
<div class="section card"><h3>Evaluaciones disponibles</h3><div class="quizlist">${db.quizzes.filter(q=>q.published).map(q=>`<div class="card"><div class="between"><strong>${esc(q.title)}</strong><span class="pill">${q.questions.length} preguntas</span></div><div class="muted">${esc(q.category)} · ${esc(q.difficulty)}</div></div>`).join('')||'<div class="empty">No hay evaluaciones publicadas.</div>'}</div></div>`)}
function traineesPage(){return shell('Pasantes','Registra y administra los perfiles del grupo',`${nav('trainees')}<div class="card"><div class="between"><h3>Listado de pasantes</h3>${btn('Añadir pasante','addTrainee')}</div>${db.trainees.length?`<div class="tablewrap"><table><thead><tr><th>Nombre</th><th>Usuario</th><th>Correo</th><th>Grupo</th><th>Estado</th><th>Acciones</th></tr></thead><tbody>${db.trainees.map(t=>`<tr><td>${esc(t.name)}</td><td>${esc(t.username||'Sin usuario')}</td><td>${esc(t.email||'—')}</td><td>${esc(t.group||'General')}</td><td><span class="pill green">${t.active?'Activo':'Inactivo'}</span></td><td class="flex">${btn('Progreso','trainee:'+t.id,'small secondary')}${btn('Eliminar','deleteTrainee:'+t.id,'small danger')}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty"><strong>No has añadido pasantes</strong>Usa “Añadir pasante” para registrar al grupo.</div>'}</div>`)}
function quizzesPage(){return shell('Evaluaciones','Crea, publica y organiza tus quizzes de TI',`${nav('quizzes')}<div class="between section"><div class="muted">Incluye preguntas objetivas y abiertas.</div>${btn('Crear categoría','newCategory','secondary')}${btn('Crear evaluación','newQuiz')}</div><div class="notice section">Puedes crear categorías propias y añadir una imagen a cada pregunta. Las categorías y evaluaciones se guardan en este navegador.</div><div class="quizlist section">${db.quizzes.map(q=>`<div class="card quizcard"><div class="between"><span class="pill">${esc(q.category)}</span><span class="pill ${q.published?'green':'amber'}">${q.published?'Publicada':'Borrador'}</span></div><h3>${esc(q.title)}</h3><div class="muted">${esc(q.description||'Sin descripción')}</div><div class="smalltext">${q.questions.length} preguntas · ${q.questions.reduce((s,x)=>s+(x.type==='text'?1:0),0)} abiertas · ${totalPoints(q)} puntos posibles</div><div class="bottom">${btn('Editar','edit:'+q.id,'secondary')}${btn(q.published?'Despublicar':'Publicar','publish:'+q.id,'secondary')}${btn('Eliminar','deleteQuiz:'+q.id,'danger small')}</div></div>`).join('')}</div>`)}
function attemptsPage(){let attempts=[...db.attempts].filter(a=>a.status!=='in_progress').reverse();return shell('Intentos y resultados','Historial de evaluaciones entregadas',`${nav('attempts')}<div class="card">${attempts.length?`<div class="tablewrap"><table><thead><tr><th>Pasante</th><th>Evaluación</th><th>Fecha</th><th>Resultado</th><th>Estado</th><th></th></tr></thead><tbody>${attempts.map(a=>`<tr><td>${esc(traineeName(a.traineeId))}</td><td>${esc(quizName(a.quizId))}</td><td>${a.submittedAt?new Date(a.submittedAt).toLocaleString():'—'}</td><td>${a.status==='graded'?a.score+'/'+a.max+' ('+pct(a)+'%)':a.objectiveGot+'/'+a.objectiveMax+' puntos objetivos'}</td><td>${statusPill(a.status)}</td><td>${btn(a.status==='submitted'?'Revisar':'Ver','attempt:'+a.id,'small secondary')}</td></tr>`).join('')}</tbody></table></div>${btn('Exportar resultados CSV','exportCSV','secondary')}</div>`:'<div class="empty"><strong>Aún no hay resultados</strong>Cuando un pasante entregue un quiz, aparecerá aquí.</div>'}</div>`)}
function reviewPage(){let items=[...db.attempts].filter(a=>a.status==='submitted');return shell('Revisión manual','Califica las respuestas abiertas para cerrar cada evaluación',`${nav('review')}<div class="card">${items.length?`<div class="tablewrap"><table><thead><tr><th>Pasante</th><th>Evaluación</th><th>Entregado</th><th>Preguntas abiertas</th><th></th></tr></thead><tbody>${items.map(a=>{let q=db.quizzes.find(q=>q.id===a.quizId),n=q?q.questions.filter(x=>x.type==='text').length:0;return `<tr><td>${esc(traineeName(a.traineeId))}</td><td>${esc(quizName(a.quizId))}</td><td>${new Date(a.submittedAt).toLocaleString()}</td><td>${n}</td><td>${btn('Calificar','attempt:'+a.id,'small')}</td></tr>`}).join('')}</tbody></table></div>`:'<div class="empty"><strong>No hay respuestas pendientes</strong>Las respuestas escritas aparecerán aquí cuando sean entregadas.</div>'}</div>`)}
function studentSelectPage(){return studentPage()}
function studentPage(){let t=db.trainees.find(t=>t.id===selectedTrainee);if(!t)return studentSelectPage();let qs=db.quizzes.filter(q=>q.published),attempts=db.attempts.filter(a=>a.traineeId===t.id&&a.status!=='in_progress'),done=new Set(attempts.map(a=>a.quizId)).size,graded=attempts.filter(a=>a.status==='graded'),avg=graded.length?Math.round(graded.reduce((s,a)=>s+pct(a),0)/graded.length):null;
return shell('Hola, '+esc(t.name.split(' ')[0])+' 👋','Este es tu espacio de aprendizaje',`<div class="between"><div class="muted">Completa tus evaluaciones y revisa tu progreso.</div></div><div class="grid section"><div class="card"><div class="metric">${done}/${qs.length}</div><div class="metric-label">Evaluaciones entregadas</div></div><div class="card"><div class="metric">${qs.length?Math.round(done/qs.length*100):0}%</div><div class="metric-label">Progreso</div></div><div class="card"><div class="metric">${avg===null?'—':avg+'%'}</div><div class="metric-label">Promedio calificado</div></div><div class="card"><div class="metric">${attempts.filter(a=>a.status==='submitted').length}</div><div class="metric-label">Pendientes de revisión</div></div></div><div class="section"><h3>Evaluaciones</h3><div class="quizlist">${qs.map(q=>{let last=latestAttempt(t.id,q.id);return `<div class="card quizcard"><span class="pill">${esc(q.category)}</span><h3>${esc(q.title)}</h3><div class="muted">${esc(q.description)}</div><div class="smalltext">${q.questions.length} preguntas · ${totalPoints(q)} puntos posibles</div><div class="bottom">${last?statusPill(last.status):'<span class="pill">No iniciado</span>'}${btn(last?'Intentar de nuevo':'Comenzar','start:'+q.id)}</div>${last&&last.status==='graded'?`<div class="smalltext">Última nota: ${last.score}/${last.max} (${pct(last)}%)</div>`:''}</div>`}).join('')}</div></div><div class="section card"><h3>Mi historial</h3>${attempts.length?`<div class="tablewrap"><table><thead><tr><th>Evaluación</th><th>Fecha</th><th>Resultado</th><th>Estado</th></tr></thead><tbody>${[...attempts].reverse().map(a=>`<tr><td>${esc(quizName(a.quizId))}</td><td>${new Date(a.submittedAt||a.startedAt).toLocaleDateString()}</td><td>${a.status==='graded'?a.score+'/'+a.max+' ('+pct(a)+'%)':a.objectiveGot+'/'+a.objectiveMax+' puntos objetivos'}</td><td>${statusPill(a.status)}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">Todavía no has entregado evaluaciones.</div>'}</div>`)}
function contextualArt(item,category){const t=(item.text||'').toLowerCase();let title='Informática · Conceptos básicos',lines=['Entrada → Procesamiento','Almacenamiento','Salida / Comunicación'],caption='Ilustración educativa relacionada con la pregunta';if(/powershell|ipconfig|resolve-dns|comando|terminal|ping|dns|dirección ip/.test(t)){title='PowerShell · Diagnóstico de red';lines=['PS> Get-NetIPConfiguration','PS> ipconfig /all','PS> Resolve-DnsName ejemplo.com'];caption='Ejemplo ilustrativo de comandos; verifica el entorno antes de ejecutarlos'}else if(/switch|vlan|puerto|mac|trunk|poe|stp/.test(t)||category==='Switches'){title='Switch · Red local';lines=['PC 01 ── Port 1','PC 02 ── Port 2','Router ── Uplink']}else if(/ram|cpu|ssd|hdd|placa|disipador|fuente|monitor|teclado|impresora|cable/.test(t)||category==='Equipos y componentes'){title='Hardware · Componentes';lines=['CPU · Procesamiento','RAM · Memoria temporal','SSD · Almacenamiento']}else if(/phishing|contraseña|malware|seguridad|virus|firewall|respaldo/.test(t)||category==='Software y seguridad'){title='Seguridad informática';lines=['Verificar el origen','Proteger credenciales','Reportar incidentes']}else if(/soporte|usuario|ticket|incidente|fallo|problema/.test(t)||category==='Soporte técnico'){title='Mesa de ayuda · Soporte';lines=['1. Registrar incidencia','2. Diagnosticar','3. Verificar solución']}return `<figure class="question-art"><svg viewBox="0 0 760 180" role="img" aria-label="${esc(title)}"><rect width="760" height="180" fill="#0f172a"/><rect x="22" y="22" width="716" height="136" rx="12" fill="#17263a" stroke="#334155"/><circle cx="42" cy="39" r="4" fill="#f87171"/><circle cx="56" cy="39" r="4" fill="#fbbf24"/><circle cx="70" cy="39" r="4" fill="#4ade80"/><text x="38" y="66" fill="#93c5fd" font-size="15" font-family="monospace">${esc(title)}</text>${lines.map((l,i)=>`<text x="42" y="${94+i*20}" fill="${i===0?'#86efac':'#e2e8f0'}" font-size="13" font-family="monospace">${esc(l)}</text>`).join('')}</svg><figcaption>${esc(caption)} · Ilustración educativa</figcaption></figure>`}
function takePage(){let q=db.quizzes.find(x=>x.id===activeQuiz);if(!q||!selectedTrainee)return studentSelectPage();let item=q.questions[qIndex],ans=activeAnswers[item.id]??'',typeLabel={tf:'Verdadero o falso',mc:'Selección múltiple',text:'Respuesta escrita'}[item.type];let input=item.type==='text'?`<div class="field"><label for="answerInput">Tu respuesta</label><textarea id="answerInput" placeholder="Escribe tu respuesta con tus propias palabras...">${esc(ans)}</textarea></div>`:item.options.map(o=>`<label class="option"><input type="radio" name="answer" value="${esc(o)}" ${String(ans)===o?'checked':''}><span>${esc(o)}</span></label>`).join('');
return shell(q.title,`${esc(q.category)} · ${esc(typeLabel)}`,`<div class="card"><div class="qhead"><span class="pill">Pregunta ${qIndex+1} de ${q.questions.length}</span><span class="smalltext">${totalPoints(q)} puntos máximos en el quiz</span></div><div class="quiz-progress"><span style="width:${(qIndex+1)/q.questions.length*100}%"></span></div>${item.imageData?`<figure class="question-art"><img src="${item.imageData}" alt="Imagen de apoyo para la pregunta" style="display:block;max-width:100%;max-height:420px;margin:0 auto;border-radius:12px;object-fit:contain"></figure>`:contextualArt(item,q.category)}<div class="qtitle">${esc(item.text)}</div><div id="answerArea">${input}</div><div class="between section"><button class="secondary" data-action="prevQ" ${qIndex===0?'disabled':''}>Anterior</button><span class="smalltext">Tus respuestas se conservan mientras realizas el quiz.</span>${qIndex<q.questions.length-1?btn('Siguiente','nextQ'):btn('Entregar evaluación','submitQuiz')}</div></div><div class="section">${btn('Salir sin entregar','exitQuiz','secondary')}</div>`)}
function resultPage(){let a=db.attempts.find(x=>x.id===reviewAttempt);if(!a)return dashboard();let q=db.quizzes.find(x=>x.id===a.quizId);return shell('Resultado de evaluación',esc(quizName(a.quizId)),`<div class="card"><div class="scorebig">${a.status==='graded'?pct(a)+'%':'Pendiente'}</div><p>${a.status==='graded'?`Puntuación final: ${a.score} de ${a.max} puntos.`:`Puntuación objetiva provisional: ${a.objectiveGot} de ${a.objectiveMax} puntos posibles en preguntas objetivas.`}</p>${a.status==='submitted'?'<div class="notice">El supervisor revisará las respuestas escritas antes de asignar la nota final.</div>':''}<div class="section">${q.questions.map((item,i)=>`<div class="card section"><strong>${i+1}. ${esc(item.text)}</strong><p><span class="muted">Tu respuesta:</span> ${esc(a.answers[item.id]||'Sin respuesta')}</p>${item.type==='text'?`<p><span class="muted">Puntuación abierta:</span> ${a.status==='graded'?(a.manualScores?.[item.id]??'—')+' / '+item.points:'Pendiente de revisión'}</p>`:q.feedbackMode==='show'&&a.status==='graded'?`<p><span class="muted">Respuesta correcta:</span> ${esc(item.answer)}</p><p class="smalltext">${esc(item.explanation||'')}</p>`:''}</div>`).join('')}</div>${btn('Volver a mis evaluaciones','studentHome')}</div>`)}
function editQuizPage(){let q=editingQuiz?db.quizzes.find(x=>x.id===editingQuiz):null;let data=q||{title:'',category:'Informática general',difficulty:'Básico',description:'',published:false,gradingMode:'manual',feedbackMode:'hide',questions:[]};return shell(q?'Editar evaluación':'Crear evaluación','Configura el quiz y añade preguntas',`<div class="card"><div class="formgrid"><div class="field"><label>Título</label><input id="quizTitle" value="${esc(data.title)}" placeholder="Ej. Diagnóstico de hardware"></div><div class="field"><label>Categoría</label><input id="quizCategory" list="categoryOptions" value="${esc(data.category)}" placeholder="Escribe o elige una categoría"><datalist id="categoryOptions">${[...new Set([...(db.categories||[]),...db.quizzes.map(x=>x.category).filter(Boolean)])].map(x=>`<option value="${esc(x)}">`).join('')}</datalist><div class="smalltext">Puedes escribir una categoría nueva; se guardará al guardar la evaluación.</div></div><div class="field"><label>Dificultad</label><select id="quizDifficulty">${['Básico','Intermedio','Avanzado'].map(x=>`<option ${data.difficulty===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>Descripción</label><input id="quizDescription" value="${esc(data.description)}" placeholder="Qué aprenderá el pasante"></div><div class="field"><label>Corrección</label><select id="quizGradingMode"><option value="manual" ${data.gradingMode!=="automatic"?"selected":""}>Manual por el supervisor</option><option value="automatic" ${data.gradingMode==="automatic"?"selected":""}>Automática (preguntas objetivas)</option></select></div><div class="field"><label>Mostrar respuestas al finalizar</label><select id="quizFeedbackMode"><option value="hide" ${data.feedbackMode!=="show"?"selected":""}>No mostrar respuestas correctas</option><option value="show" ${data.feedbackMode==="show"?"selected":""}>Mostrar tras calificar</option></select></div></div><div class="between section"><h3>Preguntas (${data.questions.length})</h3>${btn('Añadir pregunta','addQuestion','secondary')}</div><div id="questionEditor">${data.questions.map((x,i)=>questionEditor(x,i)).join('')||'<div class="empty">Añade tu primera pregunta.</div>'}</div><div class="flex section">${btn('Guardar evaluación','saveQuiz')}${btn('Cancelar','cancelEdit','secondary')}</div></div>`)}
function questionEditor(x,i){return `<div class="card section qedit" data-qid="${esc(x.id)}"><div class="between"><strong>Pregunta ${i+1}</strong>${btn('Eliminar pregunta','removeQuestion:'+x.id,'small danger')}</div><div class="field"><label>Enunciado</label><textarea data-prop="text">${esc(x.text)}</textarea></div><div class="formgrid"><div class="field"><label>Tipo</label><select data-prop="type"><option value="tf" ${x.type==='tf'?'selected':''}>Verdadero / falso</option><option value="mc" ${x.type==='mc'?'selected':''}>Selección múltiple</option><option value="text" ${x.type==='text'?'selected':''}>Respuesta escrita</option></select></div><div class="field"><label>Puntos</label><input type="number" min="1" max="20" data-prop="points" value="${Number(x.points)||1}"></div></div><div class="optionsEditor ${x.type==='text'?'hidden':''}"><div class="field"><label>Opciones (una por línea; para V/F escribe Verdadero y Falso)</label><textarea data-prop="options">${esc((x.options||[]).join('\n'))}</textarea></div><div class="field"><label>Respuesta correcta (escribe una opción exactamente)</label><input data-prop="answer" value="${esc(x.answer||'')}"></div></div><div class="field"><label>Imagen de la pregunta (opcional)</label><input type="file" accept="image/*" data-prop="imageFile"><div class="smalltext">Formatos de imagen habituales. Recomendado: JPG o PNG de menos de 1.5 MB.</div><img data-prop="imagePreview" alt="Vista previa de la imagen de la pregunta" src="${x.imageData||''}" style="${x.imageData?'display:block;':'display:none;'}max-width:100%;max-height:260px;object-fit:contain;border:1px solid #e2e8f0;border-radius:10px;margin-top:8px"><button type="button" class="secondary small" data-action="removeImage:${esc(x.id)}">Quitar imagen</button><input type="hidden" data-prop="imageData" value="${x.imageData||''}"></div><div class="field"><label>Explicación o criterio de corrección</label><textarea data-prop="explanation">${esc(x.explanation||'')}</textarea></div></div>`}
function wire(){document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{view=b.dataset.view;render()});document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>action(b.dataset.action));document.getElementById('switchRole').onclick=()=>{if(role==='guest'){view='login';render()}else action('logout')};let answer=document.getElementById('answerInput');if(answer)answer.oninput=()=>{let q=db.quizzes.find(x=>x.id===activeQuiz);if(q)activeAnswers[q.questions[qIndex].id]=answer.value};document.querySelectorAll('input[name="answer"]').forEach(r=>r.onchange=()=>{let q=db.quizzes.find(x=>x.id===activeQuiz);if(q)activeAnswers[q.questions[qIndex].id]=r.value});document.querySelectorAll('.qedit [data-prop="type"]').forEach(s=>s.onchange=()=>{let el=s.closest('.qedit'),box=el.querySelector('.optionsEditor');box.classList.toggle('hidden',s.value==='text');if(s.value==='tf'){el.querySelector('[data-prop="options"]').value='Verdadero\nFalso';el.querySelector('[data-prop="answer"]').value='Verdadero'}else if(s.value==='mc'&&!el.querySelector('[data-prop="options"]').value)el.querySelector('[data-prop="options"]').value='Opción A\nOpción B\nOpción C\nOpción D'});document.querySelectorAll('.qedit [data-prop="imageFile"]').forEach(inp=>inp.onchange=()=>{const f=inp.files&&inp.files[0];if(!f)return;if(!f.type.startsWith('image/')){alert('Selecciona un archivo de imagen.');inp.value='';return}if(f.size>1572864){alert('La imagen supera 1.5 MB. Reduce su tamaño e inténtalo de nuevo.');inp.value='';return}const reader=new FileReader();reader.onload=()=>{const el=inp.closest('.qedit'),hidden=el.querySelector('[data-prop="imageData"]'),preview=el.querySelector('[data-prop="imagePreview"]');hidden.value=reader.result;preview.src=reader.result;preview.style.display='block'};reader.readAsDataURL(f)});document.querySelectorAll('[data-action^="removeImage:"]').forEach(b=>b.onclick=()=>{const el=b.closest('.qedit');el.querySelector('[data-prop="imageData"]').value='';const im=el.querySelector('[data-prop="imagePreview"]');im.src='';im.style.display='none';const file=el.querySelector('[data-prop="imageFile"]');if(file)file.value=''})}
function action(a){
if(role==='student' && !['logout','start:'].some(x=>a===x||a.startsWith(x)) && !['nextQ','prevQ','submitQuiz','exitQuiz','studentHome'].includes(a) && !a.startsWith('start:')){alert('No tienes permiso para esa acción.');return}
if(a==='login'){let u=(document.getElementById('loginUsername')?.value||'').trim(),p=document.getElementById('loginPassword')?.value||'';if(u===db.adminAccount.username&&p===db.adminAccount.password){role='admin';currentUser={role:'admin',name:db.adminAccount.name};view='dashboard';render();return}let t=db.trainees.find(x=>x.active&&x.username===u&&x.password===p);if(t){role='student';currentUser={role:'student',id:t.id,name:t.name};selectedTrainee=t.id;view='student';render();return}let e=document.getElementById('loginError');if(e)e.textContent='Usuario o contraseña incorrectos.';return}
if(a==='logout'){role='guest';currentUser=null;selectedTrainee='';activeQuiz=null;activeAnswers={};view='login';render();return}
if(a==='addTrainee'){let name=prompt('Nombre completo del pasante:');if(!name||!name.trim())return;let username=prompt('Crea el nombre de usuario para '+name.trim()+':');if(!username||!username.trim())return;if(db.trainees.some(t=>t.username===username.trim())){alert('Ese usuario ya existe.');return}let password=prompt('Crea una contraseña temporal para '+name.trim()+':');if(!password||password.length<6){alert('La contraseña debe tener al menos 6 caracteres.');return}let email=prompt('Correo (opcional):')||'';let group=prompt('Grupo o área (opcional):')||'General';db.trainees.push({id:'t-'+Date.now(),name:name.trim(),username:username.trim(),password,email:email.trim(),group:group.trim(),active:true});save();alert('Pasante creado. Usuario: '+username.trim()+'\nContraseña: '+password+'\nEntrégale estos datos de forma privada.');render();return}
if(a.startsWith('deleteTrainee:')){let id=a.split(':')[1];if(confirm('¿Eliminar el pasante y sus intentos?')){db.trainees=db.trainees.filter(t=>t.id!==id);db.attempts=db.attempts.filter(x=>x.traineeId!==id);if(selectedTrainee===id)selectedTrainee='';save();render()}return}
if(a.startsWith('trainee:')){let id=a.split(':')[1],t=db.trainees.find(x=>x.id===id);alert(`${t.name}\nCorreo: ${t.email||'—'}\n\n${db.attempts.filter(x=>x.traineeId===id&&x.status!=='in_progress').map(x=>quizName(x.quizId)+': '+(x.status==='graded'?pct(x)+'%':'Pendiente de revisión')).join('\n')||'Sin intentos entregados'}`);return}
if(a==='newCategory'){const name=prompt('Nombre de la nueva categoría:');if(!name||!name.trim())return;const clean=name.trim();db.categories=[...new Set([...(db.categories||[]),clean])];save();alert('Categoría creada: '+clean+'\nAhora puedes seleccionarla al crear una evaluación.');render();return}
if(a==='newQuiz'){editingQuiz=null;view='editQuiz';render();return}
if(a.startsWith('edit:')){editingQuiz=a.split(':')[1];view='editQuiz';render();return}
if(a.startsWith('publish:')){let q=db.quizzes.find(x=>x.id===a.split(':')[1]);q.published=!q.published;save();render();return}
if(a.startsWith('deleteQuiz:')){let id=a.split(':')[1];if(confirm('¿Eliminar esta evaluación? Los intentos existentes se conservarán, pero no se podrá volver a abrir la evaluación.')){db.quizzes=db.quizzes.filter(q=>q.id!==id);save();render()}return}
if(a==='addQuestion'){let holder=document.getElementById('questionEditor');let current=readQuestionEditors();current.push({id:'p-'+Date.now(),type:'mc',text:'',options:['Opción A','Opción B','Opción C','Opción D'],answer:'Opción A',explanation:'',points:1,imageData:''});holder.innerHTML=current.map(questionEditor).join('');wire();return}
if(a.startsWith('removeQuestion:')){let id=a.split(':')[1];let current=readQuestionEditors().filter(q=>q.id!==id);document.getElementById('questionEditor').innerHTML=current.map(questionEditor).join('')||'<div class="empty">Añade tu primera pregunta.</div>';wire();return}
if(a==='saveQuiz'){saveQuizFromForm();return}
if(a==='cancelEdit'){view='quizzes';render();return}
if(a==='selectTrainee'){let v=document.getElementById('traineePick').value;if(!v){alert('Selecciona un pasante.');return}selectedTrainee=v;view='student';role='student';render();return}
if(a==='changeTrainee'){selectedTrainee='';view='studentSelect';render();return}
if(a==='studentHome'){view='student';render();return}
if(a.startsWith('start:')){let id=a.split(':')[1];activeQuiz=id;activeAnswers={};qIndex=0;view='take';render();return}
if(a==='nextQ'||a==='prevQ'){let q=db.quizzes.find(x=>x.id===activeQuiz);if(a==='nextQ'&&qIndex<q.questions.length-1)qIndex++;if(a==='prevQ'&&qIndex>0)qIndex--;render();return}
if(a==='exitQuiz'){if(confirm('¿Salir sin entregar? Las respuestas de este intento no se guardarán.')){view='student';render()}return}
if(a==='submitQuiz'){submitQuiz();return}
if(a.startsWith('attempt:')){reviewAttempt=a.split(':')[1];let at=db.attempts.find(x=>x.id===reviewAttempt);if(at&&at.status==='submitted'){view='reviewOne';renderReviewOne()}else{view='result';render()}return}
if(a==='exportCSV'){exportCSV();return}}
function readQuestionEditors(){return [...document.querySelectorAll('.qedit')].map(el=>{let get=p=>el.querySelector(`[data-prop="${p}"]`);let type=get('type').value,options=(get('options')?.value||'').split('\n').map(x=>x.trim()).filter(Boolean);return {id:el.dataset.qid,type,text:get('text').value.trim(),points:Math.max(1,Number(get('points').value)||1),options:type==='text'?[]:options,answer:type==='text'?'':get('answer').value.trim(),explanation:get('explanation').value.trim(),imageData:get('imageData')?.value||''}})}
function saveQuizFromForm(){let title=document.getElementById('quizTitle').value.trim(),questions=readQuestionEditors();if(!title){alert('Escribe el título de la evaluación.');return}if(!questions.length){alert('Añade al menos una pregunta.');return}for(let [i,q] of questions.entries()){if(!q.text){alert('Completa el enunciado de la pregunta '+(i+1));return}if(q.type!=='text'&&(q.options.length<2||!q.options.includes(q.answer))){alert('Verifica las opciones y la respuesta correcta de la pregunta '+(i+1));return}if(q.type==='tf')q.options=['Verdadero','Falso'];}
let data={id:editingQuiz||'q-'+Date.now(),title,category:document.getElementById('quizCategory').value.trim()||'Sin categoría',difficulty:document.getElementById('quizDifficulty').value,description:document.getElementById('quizDescription').value.trim(),gradingMode:document.getElementById('quizGradingMode')?.value||'manual',feedbackMode:document.getElementById('quizFeedbackMode')?.value||'hide',published:false,questions};let idx=db.quizzes.findIndex(x=>x.id===data.id);if(idx>=0){data.published=db.quizzes[idx].published;db.quizzes[idx]=data}else db.quizzes.push(data);db.categories=[...new Set([...(db.categories||[]),data.category])];save();view='quizzes';render()}
function submitQuiz(){let q=db.quizzes.find(x=>x.id===activeQuiz);if(!q)return;let unanswered=q.questions.filter(x=>!String(activeAnswers[x.id]??'').trim());if(unanswered.length&&!confirm(`Hay ${unanswered.length} pregunta(s) sin responder. ¿Quieres entregar de todos modos?`))return;let sc=objectiveScore(q,activeAnswers),hasText=q.questions.some(x=>x.type==='text'),attempt={id:'a-'+Date.now(),traineeId:selectedTrainee,quizId:q.id,answers:{...activeAnswers},startedAt:new Date().toISOString(),submittedAt:new Date().toISOString(),objectiveGot:sc.got,objectiveMax:sc.objectiveMax,score:sc.got,max:totalPoints(q),status:(hasText||q.gradingMode!=='automatic')?'submitted':'graded',manualScores:{}};if(!hasText&&q.gradingMode==='automatic'){attempt.score=sc.got;attempt.max=sc.objectiveMax}db.attempts.push(attempt);save();reviewAttempt=attempt.id;view='result';render()}
function renderReviewOne(){let a=db.attempts.find(x=>x.id===reviewAttempt),q=db.quizzes.find(x=>x.id===a.quizId);if(!a||!q){view='review';render();return}let open=q.questions.filter(x=>x.type==='text');app.innerHTML=shell('Calificar respuestas abiertas',`${esc(traineeName(a.traineeId))} · ${esc(q.title)}`,`<div class="card"><div class="notice">Puntúa cada respuesta según su exactitud, razonamiento y cumplimiento del criterio esperado. Puedes dejar comentarios de retroalimentación.</div>${open.map((x,i)=>`<div class="section card"><h3>${i+1}. ${esc(x.text)}</h3><p><strong>Respuesta del pasante</strong><br>${esc(a.answers[x.id]||'Sin respuesta')}</p><p class="smalltext">Criterio sugerido: ${esc(x.explanation||'Valora la precisión y claridad.')}</p><div class="formgrid"><div class="field"><label>Puntos (máximo ${x.points})</label><input type="number" min="0" max="${x.points}" step="0.5" id="score-${x.id}" value="${a.manualScores?.[x.id]??''}"></div><div class="field"><label>Comentario para el pasante</label><input id="comment-${x.id}" value="${esc(a.comments?.[x.id]||'')}" placeholder="Fortalezas y aspectos a mejorar"></div></div></div>`).join('')}<div class="section flex">${btn('Guardar calificación','saveReview')}${btn('Volver','backReview','secondary')}</div></div>`);wire();document.querySelector('[data-action="saveReview"]').onclick=()=>{let sum=a.objectiveGot;for(let x of open){let val=document.getElementById('score-'+x.id).value;if(val===''||Number(val)<0||Number(val)>x.points){alert('Introduce una puntuación válida para cada respuesta abierta.');return}a.manualScores[x.id]=Number(val);a.comments=a.comments||{};a.comments[x.id]=document.getElementById('comment-'+x.id).value;sum+=Number(val)}a.score=sum;a.max=totalPoints(q);a.status='graded';a.gradedAt=new Date().toISOString();save();view='review';render()};document.querySelector('[data-action="backReview"]').onclick=()=>{view='review';render()}}
function exportCSV(){let rows=[['Pasante','Correo','Evaluacion','Categoria','Fecha entrega','Estado','Puntuacion','Maximo','Porcentaje']];db.attempts.filter(a=>a.status!=='in_progress').forEach(a=>{let t=db.trainees.find(x=>x.id===a.traineeId),q=db.quizzes.find(x=>x.id===a.quizId);rows.push([t?.name||'',t?.email||'',q?.title||'',q?.category||'',a.submittedAt||'',a.status,a.score,a.max,a.status==='graded'?pct(a):''])});let csv=rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n');download('resultados-academia-ti.csv',csv,'text/csv;charset=utf-8')}
function download(name,data,type){let blob=new Blob(['\ufeff'+data],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.click();URL.revokeObjectURL(url)}
// Support review route without adding a permanent tab.
const originalRender=render;
function wire(){document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{view=b.dataset.view;render()});document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>action(b.dataset.action));document.getElementById('switchRole').onclick=()=>{if(role==='guest'){view='login';render()}else action('logout')};let answer=document.getElementById('answerInput');if(answer)answer.oninput=()=>{let q=db.quizzes.find(x=>x.id===activeQuiz);if(q)activeAnswers[q.questions[qIndex].id]=answer.value};document.querySelectorAll('input[name="answer"]').forEach(r=>r.onchange=()=>{let q=db.quizzes.find(x=>x.id===activeQuiz);if(q)activeAnswers[q.questions[qIndex].id]=r.value});document.querySelectorAll('.qedit [data-prop="type"]').forEach(s=>s.onchange=()=>{let el=s.closest('.qedit'),box=el.querySelector('.optionsEditor');box.classList.toggle('hidden',s.value==='text');if(s.value==='tf'){el.querySelector('[data-prop="options"]').value='Verdadero\nFalso';el.querySelector('[data-prop="answer"]').value='Verdadero'}else if(s.value==='mc'&&!el.querySelector('[data-prop="options"]').value)el.querySelector('[data-prop="options"]').value='Opción A\nOpción B\nOpción C\nOpción D'})}
render();
</script>
</body>
</html>
